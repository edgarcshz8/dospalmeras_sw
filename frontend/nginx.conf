server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: busca de nuevo la IP del backend cada 10 s
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://dospalmeras-api:3001;

    # Proxy API al backend
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy imágenes subidas al backend
    # ^~ evita que la regla de assets estáticos de abajo capture /uploads/*.jpg
    location ^~ /uploads/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Bloquear archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        return 404;
    }

    # SPA fallback — todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}