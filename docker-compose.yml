services:
  # 1) Elimina por completo el servicio "db"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    # 2) Quita el depends_on: db
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app
      - dokploy-network   # 3) para poder alcanzar bd_dos_palmeras
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  uploads_data:
  # 4) Elimina postgres_data_v2

networks:
  app:
  dokploy-network:
    external: true