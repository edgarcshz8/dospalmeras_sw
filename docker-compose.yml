services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    volumes:
      - uploads_data:/app/uploads
    networks:
      app:
        aliases:
          - dospalmeras-api
      dokploy-network:
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  uploads_data:

networks:
  app:
    driver: bridge
  dokploy-network:
    external: true